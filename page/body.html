<!-- Text lives in i18n.js. data-i18n="key" fills an element's text, data-i18n-ph a placeholder,
     data-i18n-aria an aria-label and data-i18n-alt an image description, in whichever language is chosen. -->
<canvas id="snow" aria-hidden="true"></canvas>
<main class="wrap" id="main">
 <div class="side">
  <div class="hero">
    <button type="button" class="motion-toggle" id="motionBtn" aria-pressed="false" data-i18n-aria="pauseAll">
      <svg class="ic-pause" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
      <svg class="ic-play" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M6 3.5v13l10-6.5z"/></svg>
    </button>
    @@LIGHTS@@
    <div class="stage">
      <svg class="hills" viewBox="0 0 360 215" aria-hidden="true">
        <path d="M16 190 C18 110 36 34 100 22 C140 14 172 30 204 24 C244 16 296 10 322 50 C340 80 346 150 348 190Z" fill="#dbe8f0"/>
        <path d="M60 60 C74 40 92 30 112 27 M214 28 C250 22 292 22 312 52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
        <path d="M4 215 C4 190 34 170 100 168 C160 166 210 164 262 166 C322 168 356 190 356 215Z" fill="#ffffff"/>
        <ellipse cx="118" cy="198" rx="52" ry="5.5" fill="#d5e2ea"/>
        <ellipse cx="246" cy="198.5" rx="58" ry="6" fill="#d5e2ea"/>
        <ellipse cx="31" cy="196.5" rx="24" ry="3.5" fill="#d5e2ea"/>
        <ellipse cx="333" cy="198" rx="25" ry="3.5" fill="#d5e2ea"/>
        <g transform="translate(-7.6 108) scale(.62)">
@@TREE@@
        </g>
        <g transform="translate(312 149) scale(.7)">
          <rect x="4" y="40" width="52" height="28" rx="2" fill="#c62f45"/><rect x="26" y="40" width="8" height="28" fill="#ffffff"/>
          <rect x="2" y="35" width="56" height="8" rx="2" fill="#a8233a"/><rect x="26" y="35" width="8" height="8" fill="#ffffff"/>
          <rect x="16" y="14" width="30" height="21" rx="2" fill="#2f8a66"/><rect x="28" y="14" width="6" height="21" fill="#f2c14e"/>
          <rect x="14" y="10" width="34" height="7" rx="2" fill="#26795a"/><rect x="28" y="10" width="6" height="7" fill="#f2c14e"/>
          <path d="M31 10 C22 -1 18 8 31 10 C44 8 40 -1 31 10Z" fill="#f2c14e"/>
        </g>
      </svg>
      <img class="pets pet-cat" src="pets.png" alt="" data-i18n-alt="petsAlt" width="1774" height="887">
      <img class="pets pet-dog" src="pets.png" alt="" aria-hidden="true" width="1774" height="887">
      <button type="button" class="pet-touch cat-touch" data-pet="cat" data-i18n-aria="petCat"></button>
      <button type="button" class="pet-touch dog-touch" data-pet="dog" data-i18n-aria="petDog"></button>
      <span class="nametag cat" lang="zh-CN">蛋饼 · Eggs Benedict</span>
      <span class="nametag dog" lang="zh-CN">小蛙 · Waffle</span>
    </div>
  </div>

  <header class="label">
    <div class="label-top">
      <span class="eyebrow">
        <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true"><path d="M13 11 C8 3 3 5 1 2 C1 8 3 13 13 12Z" fill="#2f8a66"/><path d="M15 11 C20 3 25 5 27 2 C27 8 25 13 15 12Z" fill="#1f6b4a"/><circle cx="11.6" cy="14.6" r="3" fill="#d42a43"/><circle cx="16.6" cy="15" r="3" fill="#b8203a"/><circle cx="14" cy="10.8" r="2.6" fill="#e8495e"/></svg>
        <span data-i18n="eyebrow"></span>
      </span>
      <span class="pill" id="statusPill" hidden></span>
    </div>
    <h1 id="title">Secret Santa</h1>
    <dl class="fields" id="eventFields" hidden>
      <div><dt data-i18n="budget"></dt><dd id="fBudget">—</dd></div>
      <div><dt data-i18n="exchangeDay"></dt><dd id="fDate">—</dd></div>
    </dl>
    <dl class="fields one" id="homeFields" hidden>
      <div><dt data-i18n="howTitle"></dt><dd data-i18n="howBody"></dd></div>
    </dl>
    <p class="deadline" id="deadline" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 5.5V10l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="deadlineText"></span></p>
    <p class="deadline" id="countdown" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="8" width="15" height="9.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 11h15M10 8v9.5M6 8c-2.2 0-3-1.2-3-2.2S4.2 4 5.4 4.4C7 5 8.3 6.6 10 8c1.7-1.4 3-3 4.6-3.6 1.2-.4 2.4.4 2.4 1.4S16.2 8 14 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="countdownText"></span></p>
    <!-- language buttons, filled in by app.js from the list in i18n.js -->
    <nav class="langs" id="langs" data-i18n-aria="langLabel"></nav>
  </header>
 </div>
 <div class="flow">
  <p class="notice" id="notice" role="status" hidden></p>
  <!-- placeholder while the first answer from the server is on its way -->
  <section class="card skeleton" id="skeleton" aria-hidden="true"><span></span><span></span><span></span></section>
  <!-- shown only when this page is opened at an old address -->
  <p class="moved" id="moved" hidden><span id="movedText"></span> <a id="movedLink" href="#"></a></p>

  <!-- home page: create an event -->
  <section class="card" id="createdCard" hidden>
    <h2 data-i18n="createdTitle"></h2>
    <section class="handoff group" aria-labelledby="groupHead">
      <h3 id="groupHead" data-i18n="forGroup"></h3>
      <p class="hint" data-i18n="forGroupBody"></p>
      <input id="newShare" readonly data-i18n-aria="shareLabel">
      <div class="row2">
        <button type="button" class="btn primary" data-copy="newShare" data-i18n="copyShare"></button>
        <button type="button" class="btn" id="newShareBtn" data-i18n="share"></button>
      </div>
    </section>
    <section class="handoff keep" aria-labelledby="keepHead">
      <h3 id="keepHead"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="3" y="8.5" width="14" height="9.5" rx="2" fill="currentColor"/><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg> <span data-i18n="forYou"></span></h3>
      <p class="hint" data-i18n="forYouBody"></p>
      <div class="masked">
        <input id="newAdmin" type="password" readonly data-i18n-aria="adminLinkLabel">
        <button type="button" class="link" id="newAdminShow" data-i18n="reveal"></button>
      </div>
      <div class="row2">
        <button type="button" class="btn" data-copy="newAdmin" data-i18n="copyAdmin"></button>
        <a class="btn" id="newAdminMail" href="#" data-i18n="mailMe"></a>
      </div>
    </section>
    <a class="btn primary" id="newOpen" href="#" data-i18n="openEvent"></a>
  </section>

  <section class="card" id="mineCard" hidden>
    <h2 data-i18n="mineTitle"></h2>
    <ul class="people" id="mineList"></ul>
    <p class="hint" data-i18n="mineHint"></p>
  </section>

  <section class="card" id="createCard" hidden>
    <h2 data-i18n="createTitle"></h2>
    <form id="createForm" class="stack">
      <label for="newTitle" data-i18n="eventName"></label>
      <input id="newTitle" maxlength="30" autocomplete="off">
      <label for="newBudget" data-i18n="budget"></label>
      <input id="newBudget" maxlength="20" autocomplete="off" data-i18n-ph="budgetPh">
      <label for="newDate" data-i18n="exchangeDay"></label>
      <input id="newDate" type="date">
      <label for="newOrgPin" data-i18n="orgPinLabel"></label>
      <input id="newOrgPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-describedby="orgPinHint">
      <p class="hint" id="orgPinHint" data-i18n="orgPinHint"></p>
      <button class="btn primary" id="createBtn" data-i18n="createBtn"></button>
      <p class="err" id="createErr" role="alert"></p>
    </form>
    <p class="hint" data-i18n="privacyShort"></p>
    <details class="why"><summary data-i18n="privacyMore"></summary><p class="hint" data-i18n="privacyDetails"></p></details>
  </section>

  <!-- event page -->
  <section class="card" id="goneCard" hidden>
    <h2 data-i18n="goneTitle"></h2>
    <p data-i18n="goneBody"></p>
    <a class="btn" href="./" data-i18n="goneNew"></a>
  </section>

  <section class="card" id="meCard" hidden>
    <h2 id="meTitle" tabindex="-1"></h2>
    <p class="okmsg" id="joinedNote" role="status"></p>
    <p id="meStatus"></p>
    <p class="hint" id="resetNote" hidden></p>
    <div id="tagSlot"></div>
    <div class="nudge" id="nudge" hidden>
      <span id="nudgeText"></span>
      <button type="button" class="btn sm" id="shareBtn" data-i18n="share"></button>
    </div>
    <!-- the organizer, on a device without the organizer link: their PIN brings the controls here -->
    <div class="recover" id="recover" hidden>
      <p><b data-i18n="orgRecoverTitle"></b> <span data-i18n="orgRecoverBody"></span></p>
      <button type="button" class="btn" id="recoverBtn" data-i18n="orgRecoverBtn"></button>
    </div>
    <form id="wishForm" class="stack inset">
      <label for="wishInput" data-i18n="wishLabel"></label>
      <textarea id="wishInput" rows="2" aria-describedby="wishHelp" maxlength="100" autocomplete="off"></textarea>
      <p class="hint" id="wishHelp" data-i18n="wishHelp"></p>
      <button class="btn" data-i18n="saveWish"></button>
      <p class="okmsg" id="wishOk" role="status"></p>
      <p class="err" id="wishErr" role="alert"></p>
    </form>
    <div class="row">
      <button type="button" class="link" id="logoutBtn" data-i18n="notMe"></button>
      <button type="button" class="link danger" id="leaveBtn" data-i18n="leave"></button>
    </div>
  </section>

  <section class="card" id="rosterCard" hidden>
    <h2 id="rosterTitle"></h2>
    <p class="hint" id="rosterHint"></p>
    <div class="names" id="names"></div>
    <ul class="roster" id="roster"></ul>
  </section>


  <section class="card" id="joinCard" hidden>
    <h2 data-i18n="joinTitle"></h2>
    <!-- the way back in for someone who signed up on another phone: jumps to their name in "Who's in" -->
    <p class="hint returning" id="returning" hidden><span data-i18n="returningQ"></span> <button type="button" class="link" id="findMeBtn" data-i18n="findMe"></button></p>
    <form id="joinForm" class="stack">
      <label for="joinName" data-i18n="yourName"></label>
      <input id="joinName" maxlength="24" autocomplete="off">
      <label for="joinPin" data-i18n="pinLabel"></label>
      <input id="joinPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-describedby="pinShort">
      <p class="hint" id="pinShort" data-i18n="pinShort"></p>
      <details class="why"><summary data-i18n="pinWhy"></summary><p class="hint" data-i18n="pinWhyBody"></p></details>
      <label for="joinWish" data-i18n="joinWishLabel"></label>
      <textarea id="joinWish" rows="2" aria-describedby="wishPrivacy" maxlength="100" autocomplete="off" data-i18n-ph="joinWishPh"></textarea>
      <p class="hint" id="wishPrivacy" data-i18n="wishPrivacy"></p>
      <button class="btn primary" id="joinBtn" data-i18n="joinBtn"></button>
      <p class="err" id="joinErr" role="alert"></p>
    </form>
  </section>


  <section class="card admin" id="adminCard" aria-labelledby="adminTitle" hidden>
    <h2 id="adminTitle"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="8.5" width="14" height="9.5" rx="2" fill="currentColor"/><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg> <span data-i18n="organizer"></span></h2>
    <p class="hint only-you" data-i18n="adminOnlyYou"></p>
    <div class="stack invite" id="invite">
      <h3 data-i18n="inviteTitle"></h3>
      <p class="hint" id="adminStatus"></p>
      <input id="shareUrl" readonly data-i18n-aria="shareLabel">
      <div class="row2">
        <button type="button" class="btn" id="copyShareBtn" data-copy="shareUrl" data-i18n="copyShare"></button>
        <button type="button" class="btn" id="adminShareBtn" data-i18n="share"></button>
      </div>
      <button type="button" class="link" id="msgBtn" data-i18n="copyMsg"></button>
    </div>
    <div class="stack invite" id="drawnBox" hidden>
      <p class="hint" id="adminStatusDrawn"></p>
      <button type="button" class="btn" id="msgBtnDrawn" data-i18n="copyReminder"></button>
    </div>
    <button type="button" class="btn" id="drawBtn"></button>
    <button type="button" class="link danger" id="reopenBtn" data-i18n="reopen" hidden></button>
    <p class="okmsg" id="adminOk" role="status"></p>
    <p class="err" id="adminErr" role="alert"></p>
    <details class="inset" id="manage">
      <summary id="manageSummary"></summary>
      <ul class="people" id="adminList"></ul>
    </details>
    <details class="inset" id="settings">
      <summary data-i18n="settingsSummary"></summary>
      <form id="cfgForm" class="stack">
        <label for="cfgTitle" data-i18n="eventName"></label>
        <input id="cfgTitle" maxlength="30" autocomplete="off">
        <label for="cfgBudget" data-i18n="budget"></label>
        <input id="cfgBudget" maxlength="20" autocomplete="off">
        <label for="cfgExchangeOn" data-i18n="cfgDateLabel"></label>
        <input id="cfgExchangeOn" type="date">
        <label for="cfgDrawAt" data-i18n="cfgDrawAtLabel"></label>
        <input id="cfgDrawAt" type="datetime-local">
        <p class="hint" id="cfgDrawAtHint"></p>
        <button class="btn" id="cfgSave" data-i18n="saveSettings"></button>
      </form>
    </details>
    <details class="inset" id="adminLinkBox">
      <summary data-i18n="myAdminLink"></summary>
      <div class="stack">
        <p class="hint" data-i18n="myAdminHint"></p>
        <input id="adminUrl" readonly data-i18n-aria="adminLinkAria">
        <div class="row2">
          <button type="button" class="btn" data-copy="adminUrl" data-i18n="copyAdmin"></button>
          <a class="btn" id="adminMail" href="#" data-i18n="mailMe"></a>
        </div>
        <!-- the role tied to the organizer's own sign-up, so name + PIN can bring it back on any device -->
        <h3 class="sub" data-i18n="orgLinkTitle"></h3>
        <p class="hint" id="orgPinText"></p>
        <button type="button" class="btn" id="orgPinBtn"></button>
        <p class="hint" id="orgLinkText" hidden></p>
        <button type="button" class="btn danger" id="orgLinkBtn" data-i18n="orgUnlinkBtn" hidden></button>
        <button type="button" class="link danger" id="destroyBtn" data-i18n="destroyNow"></button>
      </div>
    </details>
  </section>

  <footer>
    <a class="stamp" href="https://departmentofunnecessarythings.com/" target="_blank" rel="noopener" lang="en" aria-label="Department of Unnecessary Things">
      <span class="stamp-top">Department of</span>
      <span class="stamp-main">Unnecessary Things</span>
      <span class="stamp-sub">★ Gift Division ★</span>
    </a>
    <p class="foot-line" data-i18n="merry"></p>
    <p class="foot-line" id="retention"></p>
    <button type="button" class="foot-link" id="orgClaimBtn" data-i18n="orgClaim" hidden></button>
    <a class="foot-line" id="homeLink" href="./" data-i18n="makeOwn" hidden></a>
  </footer>
 </div>
</main>
<canvas id="fx" aria-hidden="true" hidden></canvas>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="dlgForm" method="dialog">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="dlgCancel"></button>
      <button class="btn primary" id="dlgOk"></button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
