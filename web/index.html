<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0d2a22">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https: http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>Secret Santa</title>
<meta property="og:title" content="Secret Santa">
<meta property="og:description" content="Sign up · 报名 · 참가하기 · Đăng ký">
<meta property="og:image" content="@@ORIGIN@@/pets.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2a22'/%3E%3Cpath d='M16 5 6 22h20z' fill='%232f8a66'/%3E%3Crect x='14' y='22' width='4' height='5' fill='%237a4a2a'/%3E%3Ccircle cx='16' cy='6' r='2.4' fill='%23f2c14e'/%3E%3Ccircle cx='13' cy='15' r='1.6' fill='%23ff5468'/%3E%3Ccircle cx='19' cy='18' r='1.6' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Ma+Shan+Zheng&family=Mountains+of+Christmas:wght@700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Patrick+Hand&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  /* One world, on purpose: a snowy pine-green night. String lights on top, the two pets
     sitting on a snow hill, a candy-striped parcel label under them, plain white cards,
     and one kraft gift tag that flips over for the reveal. Single theme by choice. */
  --night:#0d2a22;
  --night-glow:#1c5641;
  --on-night:#eef6f0;
  --on-night-soft:#b4cbbf;
  --card:#fbf7ef;          /* cream: an invitation, not a form */
  --paper:#fdfaf3;         /* the parcel label: warm paper, a shade lighter than the cards */
  --field:#f4efe3;
  --pine:#12352b;
  --moss:#5d6f66;
  --rule:#e3dac8;
  --berry:#b8203a;
  --berry-deep:#93182d;
  --on-berry:#ffffff;
  --gold:#f2c14e;
  --kraft:#dcbf93;
  --kraft-ink:#33240f;
  --ok:#1c7450;
  --focus:#1d6fd6;
  --font-display:"Mountains of Christmas","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-hand:"Caveat","Ma Shan Zheng","Gaegu","Kaiti SC","KaiTi",cursive;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--pine);font:16px/1.55 var(--font-body);
  background:var(--night) radial-gradient(130% 460px at 50% 0,var(--night-glow) 0,rgba(28,86,65,0) 100%) no-repeat}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px 56px;display:flex;flex-direction:column;gap:14px}
h1,h2,p,dl,dd,ul{margin:0}
h2{font:700 18px/1.3 var(--font-body);text-wrap:balance}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* string lights, then the pets on their snow hill */
.hero{position:relative;z-index:2;margin:0 -16px -32px;pointer-events:none;overflow-x:clip}
.lights{display:block;width:100%;height:auto}
.bulb{animation:twinkle 2.6s ease-in-out infinite;filter:drop-shadow(0 0 3px currentColor)}
.bulb:nth-of-type(3n+1){animation-delay:-.9s}
.bulb:nth-of-type(3n+2){animation-delay:-1.7s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}
.stage{position:relative;width:min(100%,430px);margin:-8px auto 0}
.stage::before{content:"";display:block;padding-top:59.72%}
.hills{position:absolute;inset:0;width:100%;height:100%}
.pets{position:absolute;left:0;top:12.56%;width:100%;height:auto}
.nametag{position:absolute;top:94.5%;transform:translateX(-50%);white-space:nowrap;font:700 12px/1 var(--font-body);color:#fff;padding:5px 10px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.nametag.cat{left:31.5%;background:var(--berry)}     /* a touch outward from each pet's centre so the two tags never meet */
.nametag.dog{left:70%;background:var(--ok)}

/* parcel label with a candy-stripe edge */
.label{position:relative;background:var(--paper);padding:30px 16px 0;border:7px solid var(--berry);
  border-image:repeating-linear-gradient(135deg,var(--berry) 0 9px,#fff 9px 18px,var(--ok) 18px 27px,#fff 27px 36px) 7}
.label-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;min-height:26px}
.eyebrow{display:flex;align-items:center;gap:8px;min-width:0;font-size:11px;letter-spacing:.12em;color:var(--moss);font-weight:600}
.label h1{font:700 clamp(42px,13.5vw,58px)/.95 var(--font-display);color:var(--berry);margin:8px 0 16px;text-wrap:balance;overflow-wrap:anywhere}
.label h1.long{font-size:clamp(32px,10vw,44px);line-height:1.02}      /* a long name keeps the festive face, one size down, so it wraps in two lines */
.fields{display:grid;grid-template-columns:1fr 1.3fr;border-top:2px solid var(--pine);margin:0 -16px}
.fields>div{padding:8px 12px 10px;border-left:1px dashed var(--moss);min-width:0}
.fields>div:first-child{border-left:0;padding-left:16px}
.fields dt{font-size:11px;letter-spacing:.08em;color:var(--moss)}
.fields dd{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid var(--moss);color:var(--moss);white-space:nowrap}
.pill.drawn{background:var(--ok);border-color:var(--ok);color:#fff}

/* cards and forms */
.card{background:var(--card);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
.card p,.hint{font-size:14px;color:var(--moss)}
.stack{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;font-weight:600;color:var(--moss);margin-top:4px}
input,textarea{font:16px/1.45 var(--font-body);color:var(--pine);background:var(--field);border:1.5px solid var(--rule);border-radius:10px;padding:11px 12px;width:100%}
textarea{display:block;resize:vertical;min-height:70px;overflow:hidden}      /* grows with the text (app.js), two lines to start */
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(18,53,43,.15)}
input::placeholder,textarea::placeholder{color:var(--moss);opacity:.7}
.btn{font:600 16px/1.2 var(--font-body);padding:13px 16px;border-radius:12px;border:1.5px solid var(--pine);background:transparent;color:var(--pine);cursor:pointer;transition:transform .08s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--berry);border-color:var(--berry);color:var(--on-berry)}
.btn.primary:active{background:var(--berry-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{font:600 14px/1.2 var(--font-body);background:none;border:0;padding:6px 2px;color:var(--moss);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start}
.link.danger{color:var(--berry)}
.card p.err,.err{font-size:14px;color:var(--berry);font-weight:600}
.card p.okmsg,.okmsg{font-size:14px;color:var(--ok);font-weight:600}
.err:empty,.okmsg:empty{display:none}
details>summary{cursor:pointer;font-weight:600;font-size:15px;padding:2px 0}
details[open]>summary{margin-bottom:10px}
.inset{border-top:1px solid var(--rule);padding-top:12px}

/* who is in, and the name buttons */
.roster{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.roster li{font-size:14px;padding:4px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--field);overflow-wrap:anywhere}
.names{display:flex;flex-wrap:wrap;gap:8px}
.roster{gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--pine);font:600 14px/1.2 var(--font-body);cursor:default;max-width:100%}
.chip-name{overflow-wrap:anywhere;min-width:0}
button.chip{cursor:pointer;border-color:var(--pine)}
button.chip:active{transform:scale(.98)}
.names.big .chip{padding:7px 18px 7px 7px;font-size:16px;min-height:48px}
.names.big .avatar{width:34px;height:34px;font-size:15px}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--font-body)}
.people .avatar{width:36px;height:36px;font-size:15px}
.roster .chip{border-color:var(--rule);background:#fff}
#rosterCard.after-join{order:1}      /* a first-time visitor: the sign-up card comes first, the people already in after it */
#adminCard{order:2}
#adminCard.lead{order:-1}            /* the organizer, signed up, sign-ups open: invite and draw come first */
.flow>footer{order:9}
.roster li{padding:0;border:0;background:none}

/* the gift tag */
.tag{width:100%;max-width:310px;margin:10px auto 6px;transform:rotate(-1.5deg)}
.tag-inner{filter:drop-shadow(0 4px 8px rgba(0,0,0,.17));transition:transform .2s ease-out}
.tag-inner.fold{transform:scaleX(.03);transition-timing-function:ease-in}
.tag-side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:250px;padding:46px 22px 22px;border:0;text-align:center;
  clip-path:polygon(38px 0,calc(100% - 38px) 0,100% 38px,100% 100%,0 100%,0 38px)}
.hole{position:absolute;top:15px;left:50%;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--card);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag-back .hole{background:#fff}
.tag-back{cursor:pointer;color:#fff;font:inherit;
  background:repeating-linear-gradient(135deg,var(--berry) 0 16px,var(--berry-deep) 16px 32px)}
.tag-back .for{font-size:14px;font-weight:600;letter-spacing:.04em;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px;overflow-wrap:anywhere;max-width:100%}
.tag-back .cta{font:700 34px/1.1 var(--font-display);margin-top:6px}
.tag-back .peek{font-size:13px;opacity:.92}
.tag-front{background:var(--kraft);color:var(--kraft-ink)}
.card .tag-front p{color:var(--kraft-ink)}
.tag-k{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.72}
.card .tag-front .tag-name,.tag-name{font:600 46px/1.05 var(--font-hand);overflow-wrap:anywhere;max-width:100%;margin:2px 0 4px}
.tag-wish{font-size:14px;line-height:1.45;overflow-wrap:anywhere;max-width:100%}
a.translate{white-space:nowrap;font-size:12px;font-weight:700;color:var(--pine);text-decoration-color:var(--rule);padding:4px 2px}   /* opens Google Translate with the wish; shown only when the wish is not in the page's language */
.tag-meta{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;border-top:1px dashed currentColor;padding-top:8px;margin-top:6px;width:100%;overflow-wrap:anywhere}
.tag-front .link{color:var(--kraft-ink);align-self:center;margin-top:4px}
.paw{position:absolute;right:14px;bottom:12px;width:34px;height:34px;fill:var(--kraft-ink);opacity:.16;transform:rotate(18deg)}

/* dialog + toast */
dialog{border:0;border-radius:18px;background:var(--card);color:var(--pine);padding:18px;width:min(92vw,400px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(4,16,12,.72)}
dialog h2{margin-bottom:8px}
#dlgBody{font-size:15px;color:var(--moss);display:flex;flex-direction:column;gap:10px}
#dlgBody p{overflow-wrap:anywhere}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:var(--pine);font-size:14px;font-weight:700;padding:10px 16px;border-radius:999px;max-width:88vw;text-align:center;z-index:10;box-shadow:0 5px 16px rgba(0,0,0,.28)}

@media (prefers-reduced-motion:reduce){.tag-inner{transition:none}.bulb{animation:none}}

/* page chrome that only this hosted version has */
.notice{font-size:14px;color:var(--on-night-soft);padding:0 2px}
.deadline{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:500;color:var(--pine);padding:9px 16px 10px;border-top:1px dashed var(--moss);margin:0 -16px;line-height:1.45}
.deadline svg{flex:none;margin-top:2px;color:var(--moss)}
.row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.people{list-style:none;padding:0;display:flex;flex-direction:column}
.people li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.people li:first-child{border-top:0;padding-top:0}
.who{flex:1 1 120px;min-width:0}
.who b{display:block;font-size:16px;overflow-wrap:anywhere}
.who small{display:block;font-size:13px;color:var(--moss);overflow-wrap:anywhere}
.btn.sm{font-size:14px;padding:8px 11px;white-space:nowrap}
.pin{letter-spacing:.3em;font-variant-numeric:tabular-nums;font-size:20px;text-align:center}
footer{font-size:12.5px;color:var(--on-night-soft);text-align:center;padding:4px 8px}

/* multi-event additions */
a.btn{display:block;text-align:center;text-decoration:none}
.fields.one{grid-template-columns:1fr}
.fields.one dd{font-weight:500;font-size:14px;line-height:1.5}
.who a{color:inherit}
footer a{color:var(--on-night-soft)}

/* ---- languages ----
   Buttons at the foot of the label, each written in its own language so anyone can spot theirs. */
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;margin:0 -16px;padding:8px 10px;border-top:1px dashed var(--moss)}
.langs button{font:600 13px/1.2 var(--font-body);color:var(--moss);background:none;border:1.5px solid transparent;border-radius:999px;padding:8px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--pine);border-color:var(--pine);background:var(--field)}
@media (max-width:360px){.langs{gap:2px;padding:8px 4px}.langs button{padding:8px 8px;font-size:12.5px}}   /* all four on one row on the smallest phones */

/* Each language reads in fonts made for it. Korean must never break a line in the middle of a word. */
html:lang(en),html:lang(vi){--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Noto Sans SC",sans-serif}
html:lang(ko){--font-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --font-display:"Mountains of Christmas","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}

/* The Christmas title face and the handwriting face only have plain Latin letters. Vietnamese (ơ ư ễ ...) would come
   out half in one font and half in another, so those words switch to a face that has every letter. */
html:lang(vi) .tag-back .cta{font:800 28px/1.15 var(--font-body)}
.label h1.plain{font-family:var(--font-body);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.12;color:var(--pine);letter-spacing:-.01em}
.card .tag-front .tag-name.plain,.tag-name.plain{font-family:"Patrick Hand","Caveat",var(--font-body);font-weight:400;font-size:40px}

/* Keep custom event titles legible and small controls comfortable on touchscreens. */
.link,.btn.sm,.langs button,details>summary{min-height:44px}
.link,details>summary{display:inline-flex;align-items:center}
input::placeholder,textarea::placeholder{opacity:1}


/* Two clipped copies of the original artwork keep each pet moving independently,
   with paws anchored to the snow and the surrounding scene still. */
.pet-cat{clip-path:inset(0 50% 0 0);transform-origin:30.5% 94%;animation:cat-breathe 5.8s ease-in-out infinite}
.pet-dog{clip-path:inset(0 0 0 50%);transform-origin:68% 94%;animation:waffle-sway 4.6s ease-in-out infinite;animation-delay:-1.3s}
@keyframes cat-breathe{0%,100%{transform:scaleY(1) rotate(0)}50%{transform:scaleY(1.014) rotate(-.45deg)}}
@keyframes waffle-sway{0%,100%{transform:rotate(-.65deg) scaleY(1)}50%{transform:rotate(.65deg) scaleY(1.012)}}
@media (prefers-reduced-motion:reduce){.pets{animation:none}}

/* Transparent, stable hit areas work with mouse, touch and keyboard. */
.pet-touch{position:absolute;top:19%;height:72%;border:0;border-radius:45%;background:transparent;pointer-events:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cat-touch{left:17%;width:31%}.dog-touch{left:51%;width:35%}
.nametag{pointer-events:none}
.pet-touch::after{content:"♥";position:absolute;top:8%;left:50%;font-size:25px;color:var(--berry);opacity:0;pointer-events:none;text-shadow:0 1px 2px #fff}
.pet-touch.loved::after{animation:pet-heart 1s ease-out both}
.stage.cat-curious .pet-cat{animation:cat-perk .65s ease-in-out both}
.stage.dog-curious .pet-dog{animation:dog-perk .65s ease-in-out both}
.stage .pet-cat.is-petted{animation:cat-petted .85s ease-in-out both}
.stage .pet-dog.is-petted{animation:dog-petted .85s ease-in-out both}
@keyframes cat-perk{50%,100%{transform:rotate(-2deg) scaleY(1.025)}}
@keyframes dog-perk{50%,100%{transform:rotate(2deg) scaleY(1.025)}}
@keyframes cat-petted{0%,100%{transform:none}25%{transform:rotate(-3deg) scaleY(.97)}55%{transform:rotate(2deg) scaleY(1.02)}78%{transform:rotate(-1.5deg)}}
@keyframes dog-petted{0%,100%{transform:none}20%,65%{transform:rotate(-3deg) scaleY(.97)}42%,82%{transform:rotate(3deg) scaleY(1.02)}}
@keyframes pet-heart{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){
  .stage .pets,.stage .pets.is-petted{animation:none}
  .pet-touch.loved::after{animation:none;opacity:1}
}

/* ---- one pause/play control, on the illustration ----
   Pauses the pets and the string lights here (CSS); the snow listens for the same switch in app.js. */
.motion-toggle{position:absolute;top:8px;right:10px;z-index:4;width:44px;height:44px;padding:0;border-radius:50%;border:0;
  background:transparent;color:#fff;cursor:pointer;pointer-events:auto;display:grid;place-items:center;opacity:.7}
.motion-toggle::before{content:"";grid-area:1/1;width:32px;height:32px;border-radius:50%;background:rgba(13,42,34,.45);border:1px solid rgba(255,255,255,.35)}   /* a quiet disc inside a 44px touch target */
.motion-toggle:hover,.motion-toggle:focus-visible,.motion-toggle[aria-pressed="true"]{opacity:1}
.motion-toggle svg{fill:currentColor;grid-area:1/1;width:14px;height:14px}
.motion-toggle .ic-play,.motion-toggle[aria-pressed="true"] .ic-pause{display:none}
.motion-toggle[aria-pressed="true"] .ic-play{display:block}
.motion-paused .bulb,.motion-paused .stage .pets{animation-play-state:paused}

/* ---- event pages: a smaller scene so the sign-up or the result is in view sooner (the landing page keeps the full one) ---- */
html.event .stage{width:clamp(222px,54%,232px);margin-top:-14px}   /* small enough that the first card is in view on a phone; tags sit a touch further apart */
html.event .nametag{font-size:9px;padding:3px 6px}
html.event .nametag.cat{left:29.5%}
html.event .nametag.dog{left:71.5%}
html.event .hero{margin-bottom:-20px}
html.event .label{padding-top:18px}
html.event .label h1{font-size:clamp(34px,10.5vw,46px);margin:4px 0 10px}
html.event .label h1.long{font-size:clamp(27px,8vw,36px)}
html.event .label h1.plain{font-size:clamp(26px,8vw,36px)}
html.event .label h1.plain.long{font-size:clamp(22px,6.6vw,30px)}
html.event .fields>div{padding:6px 10px 8px}
html.event .fields dd{font-size:14px}
html.event .deadline{padding:7px 16px 8px;font-size:12.5px}
html.event .langs{padding:4px 10px}
html.event .langs button{min-height:40px;padding:5px 9px;font-size:12.5px}
@media (min-width:900px){html.event .stage{width:300px}html.event .nametag.cat{left:31.5%}html.event .nametag.dog{left:70%}}

/* ---- organizer controls look different from what participants see ---- */
.card.admin{background:#f3f7f4;border:2px dashed var(--pine)}
.card.admin h2{display:flex;align-items:center;gap:8px}
.card.admin .only-you{background:var(--card);border-left:3px solid var(--pine);padding:8px 10px;border-radius:0 6px 6px 0}
/* the organizer's first job, as its own block inside the controls */
.invite{padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--rule)}
.invite h3,.handoff h3{margin:0;font:700 15px/1.3 var(--font-body);color:var(--pine);display:flex;align-items:center;gap:6px}
.row2{display:flex;gap:8px}
.row2>*{flex:1 1 0;min-width:0;white-space:normal;padding-left:10px;padding-right:10px;font-size:15px}
@media (max-width:360px){.row2{flex-direction:column}}      /* on the smallest phones the two buttons stack instead of wrapping into three lines */

/* ---- "you're all set": the link for the group, and the one link that stays with the organizer ---- */
.handoff{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--rule)}
.handoff.keep{background:#f3f7f4;border:1.5px dashed var(--pine)}
.masked{display:flex;gap:8px;align-items:center}
.masked input{flex:1 1 auto;min-width:0}
.masked .link{flex:none;align-self:center;min-height:44px}
#meTitle:focus{outline:none}        /* focus lands on the heading after a sign-up so readers hear it; it is not a control */

/* ---- the stamp along the tag's edge: secondary to the name, wish, budget and date ---- */
.tag-stamp{position:absolute;left:-76px;top:50%;width:176px;transform:translateY(-50%) rotate(-90deg);font:700 7.5px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;
  color:var(--berry);border:1.5px solid var(--berry);border-radius:3px;padding:2px 6px;opacity:.5;text-align:center;pointer-events:none}

/* ---- an old address: point to the new one ---- */
.moved{font-size:14px;color:var(--pine);background:var(--gold);border-radius:10px;padding:10px 14px;line-height:1.45}
.moved a{color:var(--pine);font-weight:700;overflow-wrap:anywhere}

/* ---- layout: the scene and label ("side"), then everything that flows; side by side on a laptop ---- */
.side,.flow{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{gap:0}
@media (min-width:900px){
  .wrap{max-width:1080px;padding:0 24px 56px;flex-direction:row;align-items:flex-start;gap:32px}
  .side{flex:0 0 420px;position:sticky;top:0}
  .flow{flex:1 1 auto;padding-top:28px;max-width:600px}
  .stage{width:360px}
  html.event .stage{width:300px}
  .label h1.plain{font-size:36px}
}

/* ---- skeleton while the first answer is on its way ---- */
.skeleton{gap:12px;min-height:150px}
.skeleton span{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--field) 25%,#ebe3d2 50%,var(--field) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skeleton span:nth-child(1){width:55%;height:20px}
.skeleton span:nth-child(2){width:90%}
.skeleton span:nth-child(3){width:70%}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton span{animation:none}}

/* ---- the way back in for someone who signed up on another device ---- */
.returning{margin-top:-4px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.returning .link{padding:4px 2px;color:var(--pine)}
.card.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--gold),0 8px 22px rgba(0,0,0,.13)}100%{box-shadow:0 8px 22px rgba(0,0,0,.13)}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none;box-shadow:0 0 0 3px var(--gold),0 8px 22px rgba(0,0,0,.13)}}

/* ---- the organizer without their link: PIN brings the controls here ---- */
.recover{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:#f3f7f4;border:1.5px dashed var(--pine)}
.card .recover p{color:var(--pine)}
h3.sub{margin:6px 0 0;font:700 14px/1.3 var(--font-body);color:var(--pine)}
.btn.danger{border-color:var(--berry);color:var(--berry)}

/* ---- after joining: bring friends in ---- */
.nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px dashed var(--rule);font-size:14px;color:var(--moss)}

/* ---- the long PIN explanation, behind a tap ---- */
.why>summary{font-size:13px;font-weight:600;color:var(--moss);min-height:32px;padding:0;list-style:none;text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted}
.why>summary::-webkit-details-marker{display:none}
.why>summary{display:inline-flex;align-items:center;gap:10px;padding-right:4px}
.why>summary::after{content:"";flex:none;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.why[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.why[open]>summary{margin-bottom:4px}

/* ---- the brand, as a rubber stamp ---- */
footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 4px}
.foot-line{margin:0;line-height:1.5;max-width:36em}
.foot-line:empty{display:none}
footer .stamp{margin-bottom:6px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px 8px;border:2px solid var(--on-night-soft);border-radius:8px;color:var(--on-night-soft);text-decoration:none;transform:rotate(-2.5deg);opacity:.85;
  mask-image:radial-gradient(circle at 30% 40%,#000 94%,transparent 95%),linear-gradient(#000,#000);-webkit-mask-image:linear-gradient(#000,#000)}
.stamp:hover,.stamp:focus-visible{opacity:1;color:var(--gold);border-color:var(--gold)}
.stamp-top{font:600 9px/1.2 var(--font-body);letter-spacing:.22em;text-transform:uppercase}
.stamp-main{font:700 13px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase}
.stamp-sub{font:600 8.5px/1.4 var(--font-body);letter-spacing:.2em;text-transform:uppercase;border-top:1px solid currentColor;margin-top:3px;padding-top:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>

 </div>
 <div class="flow">
  <p class="notice" id="notice" role="status" hidden></p>
  <!-- placeholder while the first answer from the server is on its way -->
  <section class="card skeleton" id="skeleton" aria-hidden="true"><span></span><span></span><span></span></section>
  <!-- shown only when this page is opened at an old address -->
  <p class="moved" id="moved" hidden><span id="movedText"></span> <a id="movedLink" href="#"></a></p>

  <!-- home page: create an event -->
  <section class="card" id="createdCard" hidden>
    <h2 data-i18n="createdTitle"></h2>
    <section class="handoff group" aria-labelledby="groupHead">
      <h3 id="groupHead" data-i18n="forGroup"></h3>
      <p class="hint" data-i18n="forGroupBody"></p>
      <input id="newShare" readonly data-i18n-aria="shareLabel">
      <div class="row2">
        <button type="button" class="btn primary" data-copy="newShare" data-i18n="copyShare"></button>
        <button type="button" class="btn" id="newShareBtn" data-i18n="share"></button>
      </div>
    </section>
    <section class="handoff keep" aria-labelledby="keepHead">
      <h3 id="keepHead"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="3" y="8.5" width="14" height="9.5" rx="2" fill="currentColor"/><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg> <span data-i18n="forYou"></span></h3>
      <p class="hint" data-i18n="forYouBody"></p>
      <div class="masked">
        <input id="newAdmin" type="password" readonly data-i18n-aria="adminLinkLabel">
        <button type="button" class="link" id="newAdminShow" data-i18n="reveal"></button>
      </div>
      <div class="row2">
        <button type="button" class="btn" data-copy="newAdmin" data-i18n="copyAdmin"></button>
        <a class="btn" id="newAdminMail" href="#" data-i18n="mailMe"></a>
      </div>
    </section>
    <a class="btn primary" id="newOpen" href="#" data-i18n="openEvent"></a>
  </section>

  <section class="card" id="mineCard" hidden>
    <h2 data-i18n="mineTitle"></h2>
    <ul class="people" id="mineList"></ul>
    <p class="hint" data-i18n="mineHint"></p>
  </section>

  <section class="card" id="createCard" hidden>
    <h2 data-i18n="createTitle"></h2>
    <form id="createForm" class="stack">
      <label for="newTitle" data-i18n="eventName"></label>
      <input id="newTitle" maxlength="30" autocomplete="off">
      <label for="newBudget" data-i18n="budget"></label>

  <section class="card" id="goneCard" hidden>

  <section class="card" id="rosterCard" hidden>
    <h2 id="rosterTitle"></h2>
    <p class="hint" id="rosterHint"></p>
    <div class="names" id="names"></div>
    <ul class="roster" id="roster"></ul>
  </section>


  <section class="card" id="joinCard" hidden>
    <h2 data-i18n="joinTitle"></h2>
    <!-- the way back in for someone who signed up on another phone: jumps to their name in "Who's in" -->
    <p class="hint returning" id="returning" hidden><span data-i18n="returningQ"></span> <button type="button" class="link" id="findMeBtn" data-i18n="findMe"></button></p>
    <form id="joinForm" class="stack">
      <label for="joinName" data-i18n="yourName"></label>
      <input id="joinName" maxlength="24" autocomplete="off">

      <input id="joinPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-describedby="pinShort">
      <p class="hint" id="pinShort" data-i18n="pinShort"></p>
      <details class="why"><summary data-i18n="pinWhy"></summary><p class="hint" data-i18n="pinWhyBody"></p></details>
      <label for="joinWish" data-i18n="joinWishLabel"></label>
      <textarea id="joinWish" rows="2" aria-describedby="wishPrivacy" maxlength="100" autocomplete="off" data-i18n-ph="joinWishPh"></textarea>
      <p class="hint" id="wishPrivacy" data-i18n="wishPrivacy"></p>
      <button class="btn primary" id="joinBtn" data-i18n="joinBtn"></button>
      <p class="err" id="joinErr" role="alert"></p>
    </form>

  <section class="card admin" id="adminCard" aria-labelledby="adminTitle" hidden>
    <h2 id="adminTitle"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="8.5" width="14" height="9.5" rx="2" fill="currentColor"/><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg> <span data-i18n="organizer"></span></h2>
    <p class="hint only-you" data-i18n="adminOnlyYou"></p>
    <div class="stack invite" id="invite">
      <h3 data-i18n="inviteTitle"></h3>
      <p class="hint" id="adminStatus"></p>
      <input id="shareUrl" readonly data-i18n-aria="shareLabel">
      <div class="row2">
        <button type="button" class="btn" id="copyShareBtn" data-copy="shareUrl" data-i18n="copyShare"></button>
        <button type="button" class="btn" id="adminShareBtn" data-i18n="share"></button>
      </div>
    </div>
    <p class="hint" id="adminStatusDrawn" hidden></p>
    <button type="button" class="btn" id="drawBtn"></button>
    <button type="button" class="link danger" id="reopenBtn" data-i18n="reopen" hidden></button>
    <p class="okmsg" id="adminOk" role="status"></p>
    <p class="err" id="adminErr" role="alert"></p>
    <details class="inset" id="manage">
      <summary id="manageSummary"></summary>
      <ul class="people" id="adminList"></ul>
    </details>
    <details class="inset" id="settings">
      <summary data-i18n="settingsSummary"></summary>
      <form id="cfgForm" class="stack">
        <label for="cfgTitle" data-i18n="eventName"></label>
        <input id="cfgTitle" maxlength="30" autocomplete="off">
        <label for="cfgBudget" data-i18n="budget"></label>
        <input id="cfgBudget" maxlength="20" autocomplete="off">
        <label for="cfgExchangeOn" data-i18n="cfgDateLabel"></label>

async function api(path, body) {

    catch (e) { return { ok: false, status: 0, data: { error: 'network' } }; }
    try { data = await res.json(); } catch (e) { /* not json */ }
    // "Turned away at the door": when too many requests land in the same instant, AWS answers 429 before our code runs,
    // and our own code answers 503 "busy" when it could not save. Either way nothing happened, so asking again is safe.
    // Real answers always carry an error code (a locked PIN is 429 + "locked") and are never asked twice.
    const turnedAway = (res.status === 429 && !(data && data.error)) || (res.status === 503 && !!data && data.error === 'busy');

    setTimeout(() => { swap(); inner.classList.remove('fold'); }, 200);
  };
  back.addEventListener('click', () => { const r = back.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); flip(true); });
  hide.addEventListener('click', () => flip(false));
  return tag;
}

/* ---------- loading and refreshing ---------- */
function forget() { S.me = null; S.view = null; S.justJoined = false; store.set(K_ME, null); }
function gone() { S.gone = true; S.state = null; S.view = null; S.admin = null; forgetEvent(EVENT_ID); }
async function refresh() {
  if (S.gone) return;
  if (S.me) {
    const r = await api('me', Object.assign({ id: EVENT_ID }, S.me));
    if (r.ok) { S.view = r.data; S.state = r.data.state; S.loadError = false; }
    else if (r.data.error === 'not_found') gone();
    else if (r.status === 401 || r.status === 404) { S.note = r.status === 404 ? t('removedNote') : t('reenterPin'); S.state = null; forget(); }
    else S.loadError = true;
  }
  if (!S.gone && (!S.me || !S.state)) {
    const r = await api('state', { id: EVENT_ID });
    if (r.ok) { S.state = r.data; S.loadError = false; }
    else if (r.data.error === 'not_found') gone();
    else S.loadError = true;
  }
  if (!S.gone && S.adminKey) {
    const r = await api('admin', { id: EVENT_ID, adminKey: S.adminKey, action: 'list' });
    if (r.ok) { S.admin = r.data; S.state = r.data.state; }
    else if (r.status === 403) { S.admin = null; S.adminKey = null; store.set(K_ADMIN, null); toast(errText(r.data), 5000); }
  }
  if (S.state) remember(EVENT_ID, S.state.title, !!S.admin, S.me ? S.me.name : undefined);
  if (S.note) { toast(S.note, 4000); S.note = ''; }
  render();
}

/* ---------- participant actions ---------- */
/** The server answers a join or a PIN sign-in with a random token; that token, not the PIN, is what this device keeps. */
function signedIn(data) {
  S.me = { name: data.me.name, token: data.token }; store.set(K_ME, S.me);
  S.view = data; S.state = data.state;
  remember(EVENT_ID, S.state.title, !!S.admin, S.me.name);
  render();
}
function wireEvent() {
  $('joinForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (S.busy) return;

    if (!name) { $('joinErr').textContent = t('e_bad_name'); $('joinName').focus(); return; }
    if (!/^\d{4,8}$/.test(pin)) { $('joinErr').textContent = t('e_bad_pin_format'); $('joinPin').focus(); return; }
    S.busy = true; $('joinBtn').disabled = true; $('joinBtn').textContent = t('loading'); $('joinForm').setAttribute('aria-busy', 'true'); $('joinErr').textContent = '';
    const r = await api('join', { id: EVENT_ID, name, pin, wish });
    S.busy = false; $('joinBtn').disabled = false; $('joinBtn').textContent = t('joinBtn'); $('joinForm').removeAttribute('aria-busy');
    if (!r.ok) { if (r.data.error === 'not_found') { gone(); render(); } else $('joinErr').textContent = errText(r.data); return; }
    $('joinName').value = ''; $('joinPin').value = ''; $('joinWish').value = ''; fitTextarea($('joinWish'));
    S.justJoined = true;                      // the confirmation sits in the card itself (no PIN on screen), and focus moves to it

    $('meTitle').focus({ preventScroll: true });
    $('meCard').scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' });

  });

    if (!S.me) return;

      if (pin == null) return;
      const r = await api('claimAdmin', { id: EVENT_ID, name: S.me.name, pin });
      if (r.ok) {
        S.adminKey = r.data.adminKey; store.set(K_ADMIN, S.adminKey);
        const { adminKey, ...view } = r.data; S.admin = view; S.state = view.state; remember(EVENT_ID, view.state.title, true);

  });
  const shareThis = () => shareLink(eventUrl(EVENT_ID), (S.state && S.state.title) || 'Secret Santa');

function startEvent() {
  document.documentElement.classList.add('event');      // smaller illustration: the sign-up or the result should be in view sooner
  $('homeLink').hidden = false;
  // The organizer link carries the key after '#', so it is never sent to any server as part of the address.
  // Keep it on this device, then tidy the address bar so a screenshot or a copied link does not leak it.
  const m = /^#admin=([A-Za-z0-9_-]{8,128})$/.exec(location.hash);
  if (m) { store.set(K_ADMIN, m[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* fine */ } }
  S.adminKey = m ? m[1] : store.get(K_ADMIN);
  if (typeof S.adminKey !== 'string') S.adminKey = null;
  S.me = store.get(K_ME);
  if (S.me && (typeof S.me.name !== 'string' || typeof S.me.token !== 'string')) S.me = null;
  wireEvent();
  rerender = render;
  render();
  refresh();
  // New sign-ups and the draw show up without anyone reloading.
  setInterval(() => { if (!document.hidden && !S.busy && !dlg.open) refresh(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.busy && !dlg.open) refresh(); });
}

/* ---------- falling snow, behind the cards ---------- */
(function snow() {
  const cv = $('snow');
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0, flakes = [], raf = 0, last = 0;
  const flake = (anywhere) => ({ x: Math.random() * w, y: anywhere ? Math.random() * h : -4, r: 1 + Math.random() * 2.2, v: 14 + Math.random() * 26, sway: Math.random() * 6.28, o: .4 + Math.random() * .55 });
  function size() {
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const want = Math.round(Math.min(110, Math.max(40, (w * h) / 8000)));
    while (flakes.length < want) flakes.push(flake(true));
    flakes.length = want;
    for (const f of flakes) { if (f.x > w) f.x = Math.random() * w; if (f.y > h) f.y = Math.random() * h; }
  }
  function draw() {
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#fff';
    for (const f of flakes) { ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x + Math.sin(f.sway) * 6, f.y, f.r, 0, 6.2832); ctx.fill(); }
  }
  function tick(now) {
    const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    for (const f of flakes) { f.y += f.v * dt; f.sway += dt * .9; if (f.y > h + 4) Object.assign(f, flake(false)); }
    draw(); raf = requestAnimationFrame(tick);
  }
  size(); draw();
  addEventListener('resize', () => { size(); draw(); });
  if (reduced) return;
  const running = () => !document.hidden && !motionPaused;
  const restart = () => { cancelAnimationFrame(raf); if (running()) { last = 0; raf = requestAnimationFrame(tick); } };
  restart();
  document.addEventListener('visibilitychange', restart);
  document.addEventListener('santa:motion', restart);
})();

/* One switch for everything that moves (pets, snow, lights). Keyboard and screen-reader friendly, hidden when the
   system asks for reduced motion because nothing animates then anyway. */
function setMotion(paused) {
  motionPaused = paused;
  document.documentElement.classList.toggle('motion-paused', paused);
  $('motionBtn').setAttribute('aria-pressed', String(paused));
  $('motionBtn').setAttribute('aria-label', paused ? t('playAll') : t('pauseAll'));
  document.dispatchEvent(new Event('santa:motion'));
}
$('motionBtn').addEventListener('click', () => setMotion(!motionPaused));
if (reduced) $('motionBtn').hidden = true;

// Pet reactions stay independent; rapid taps restart one short reaction.
for (const button of document.querySelectorAll('[data-pet]')) {
  const pet = document.querySelector('.pet-' + button.dataset.pet);
  const stage = button.closest('.stage');
  const curious = button.dataset.pet + '-curious';
  let reaction = 0, heartTimer = 0;
  const greet = () => { if (!motionPaused) stage.classList.add(curious); };
  const settle = () => stage.classList.remove(curious);
  button.addEventListener('pointerenter', (event) => { if (event.pointerType === 'mouse') greet(); });
  button.addEventListener('pointerleave', settle);
  button.addEventListener('focus', greet);
  button.addEventListener('blur', settle);
  button.addEventListener('click', () => {
    clearTimeout(heartTimer); cancelAnimationFrame(reaction);
    pet.classList.remove('is-petted'); button.classList.remove('loved');
    reaction = requestAnimationFrame(() => {
      reaction = requestAnimationFrame(() => {
        if (!motionPaused) pet.classList.add('is-petted');
        button.classList.add('loved');
        heartTimer = setTimeout(() => button.classList.remove('loved'), 1100);
      });
    });
  });
  pet.addEventListener('animationend', (event) => {
    if (event.animationName.endsWith('-petted')) pet.classList.remove('is-petted');
  });
}

/* ---------- opened at an old address? ----------
   The site has one official address (SANTA_HOME, written by deploy.sh). Opened anywhere else, the page points
   there. What a browser remembers (sign-ins, organizer access) is kept per address, so the link for an organizer
   carries the organizer key in the # part, exactly like the organizer link; participants sign in again with their PIN. */
function movedNote() {
  const home = String(window.SANTA_HOME || '').replace(/\/+$/, '');
  if (!home || home === location.origin) return;
  let target = home + '/';
  if (/^[a-z0-9]{12}$/.test(EVENT_ID)) {
    target += '?e=' + EVENT_ID;
    const key = store.get(K_ADMIN);
    if (typeof key === 'string' && key) target += '#admin=' + key;
  }
  const host = home.replace(/^https?:\/\//, '');
  $('movedText').textContent = t('movedText', host);
  $('movedLink').textContent = t('movedLink');
  $('movedLink').href = target;
  $('moved').hidden = false;
}

/* ---------- start ---------- */
applyLang();
if (/^[a-z0-9]{12}$/.test(EVENT_ID)) startEvent();
else if (EVENT_ID) { document.documentElement.classList.add('event'); $('homeLink').hidden = false; rerender = render; gone(); render(); }
else startHome();
movedNote();                                       // after the start: an organizer link's key is on this device by now
})();
</script>
</body>
