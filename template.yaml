AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Secret Santa - static site on Amplify Hosting, API on Lambda (Function URL), one DynamoDB table

Parameters:
  # The site's own address once a custom domain is attached in the Amplify console (Hosting > Custom domains).
  # Leave empty to use only the default main.<app>.amplifyapp.com address.
  CustomDomain:
    Type: String
    Default: gifts.departmentofunnecessarythings.com
    AllowedPattern: '^$|^[a-z0-9.-]+$'
  # An address to email when the API throws errors or gets throttled (deploy.sh passes ALERT_EMAIL). Empty: no alarm.
  # The first deploy with it sends a "confirm subscription" email from AWS; the alarm only reaches you after that click.
  AlertEmail:
    Type: String
    Default: ''
    NoEcho: true

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # One item per event (pk = E#<id>), plus short-lived counters that limit how fast events can be created.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # the API stamps `ttl` a week after an event's exchange date; DynamoDB then deletes the record on its own
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # The front of house: static files. Not connected to a repository; deploy.sh uploads web/ as a zip.
  Site:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref AWS::StackName
      Description: Secret Santa static site
      Platform: WEB

  SiteBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt Site.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false

  # The kitchen: the JSON API.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Secret Santa API
      CodeUri: api/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 1024      # CPU scales with memory: this halves the PIN check (the slow step) compared with 512
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt Table.Arn
      FunctionUrlConfig:
        AuthType: NONE
        # Only pages served from the site (default address and custom domain) may call the API from a browser.
        Cors:
          AllowOrigins:
            - !Sub 'https://main.${Site.DefaultDomain}'
            - !If [HasCustomDomain, !Sub 'https://${CustomDomain}', !Ref AWS::NoValue]
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 86400

  # Function URLs created since October 2025 need lambda:InvokeFunction as well as
  # lambda:InvokeFunctionUrl. SAM adds the pair for AuthType NONE; this spells out the second
  # one so the API is reachable whichever way the template is deployed.
  ApiFunctionUrlInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ---- alarms: an email when the API misbehaves (only with AlertEmail) ----
  Alerts:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: Secret Santa API returned errors in the last 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
      OKActions: [!Ref Alerts]
  ApiThrottles:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: Secret Santa API was throttled (more than 10 requests at once for a while)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]

Outputs:
  SiteUrl:
    Description: The website (the custom domain once it is attached). Create events here; link previews point here.
    Value: !If [HasCustomDomain, !Sub 'https://${CustomDomain}/', !Sub 'https://main.${Site.DefaultDomain}/']
  DefaultSiteUrl:
    Description: The site's built-in Amplify address, which keeps working alongside the custom domain
    Value: !Sub 'https://main.${Site.DefaultDomain}/'
  ApiEndpoint:
    Description: Where the site sends its API calls (deploy.sh writes this into config.js)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  AmplifyAppId:
    Description: Used by deploy.sh to upload the static files
    Value: !GetAtt Site.AppId
